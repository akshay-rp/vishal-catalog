<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISHAL - Catalog App</title>
    <style>
        * { font-family: -apple-system, Roboto, Arial, sans-serif !important; box-sizing: border-box; }
        body { background: #f4f6f9; margin: 0; padding-bottom: 110px; color: #0f172a; }
        header { background: #2d4059; color: white; padding: 14px; text-align: center; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 20px; }
        .search-bar { padding: 10px 14px; background: #fff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 52px; z-index: 90; }
        .search-bar input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 14px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding: 14px; }
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }
        .img-container { width: 100%; aspect-ratio: 1 / 1; background: #f8fafc; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .item-title { font-weight: bold; font-size: 15px; }
        .sizes-grid { display: flex; flex-direction: column; gap: 5px; background: #f8fafc; padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: auto; }
        .size-box { display: flex; align-items: center; justify-content: space-between; font-size: 12px; background: #fff; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .stepper { display: flex; align-items: center; gap: 4px; }
        .stepper button { width: 26px; height: 26px; background: #2d4059; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .stepper input { width: 32px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; }
        .bottom-cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 2px solid #2d4059; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .btn-checkout { background: #25D366; color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        
        /* Billing Matrix Format for Order Form */
        table.billing-matrix-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; color: #000; }
        table.billing-matrix-table th, table.billing-matrix-table td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: center; vertical-align: middle; }
        table.billing-matrix-table th { background-color: #f1f5f9; font-weight: bold; color: #2d4059; }
        table.billing-matrix-table td.desc-col { text-align: left; }
    </style>
</head>
<body>

<header>
    <h1>VISHAL</h1>
    <p>SRI RAJENDRA SURIJI NAMAHA</p>
</header>

<div class="search-bar">
    <input type="text" id="searchInput" oninput="filterCatalog()" placeholder="🔍 Search Items...">
</div>

<div class="grid" id="catalogGrid"></div>

<div class="bottom-cart-bar">
    <div class="cart-info">
        Total Qty: <span id="cartCount" style="color:#2563eb; font-weight:bold;">0 pcs</span>
    </div>
    <button type="button" class="btn-checkout" onclick="openOrderModal()">💬 Submit Order</button>
</div>

<div class="modal" id="orderModal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#2d4059; border-bottom:2px solid #2d4059; padding-bottom:6px;">Customer Order Form</h3>
        <div style="display:flex; flex-direction:column; gap:8px;">
            <input type="text" id="buyerName" placeholder="Party Name (*Required)" style="padding:8px; border:1px solid #ccc; border-radius:4px;">
            <textarea id="buyerAddr" rows="2" placeholder="Address / Transport Details" style="padding:8px; border:1px solid #ccc; border-radius:4px;"></textarea>
            <input type="text" id="buyerPhone" placeholder="Mobile Number" style="padding:8px; border:1px solid #ccc; border-radius:4px;"></textarea>
        </div>

        <h4 style="margin-top:14px; margin-bottom:4px; color:#2d4059;">Estimate Order Output Table</h4>
        <div id="orderTableContainer" style="overflow-x:auto; margin-top:8px;"></div>

        <div style="margin-top:15px; display:flex; gap:8px; justify-content:flex-end;">
            <button type="button" onclick="closeOrderModal()" style="padding:10px; background:#94a3b8; color:white; border:none; border-radius:4px;">Cancel</button>
            <button type="button" onclick="generateOrderImage()" style="padding:10px; background:#2980b9; color:white; border:none; border-radius:4px; font-weight:bold;">📸 Download Order Image</button>
            <button type="button" onclick="sendWhatsAppOrder()" style="padding:10px; background:#25D366; color:white; border:none; border-radius:4px; font-weight:bold;">Send Text via WhatsApp</button>
        </div>
    </div>
</div>

PURI (3PCS)","colour":"PCK","code":"5982345584","photo":"","sizes":[{"size":"44","stock":1}]},{"id":"cv2935_jodhpuri (3pcs)_cr","hsn":"620339","itemNo":"CV2935","type":"JODHPURI (3PCS)","colour":"CR","code":"5962235588","photo":"","sizes":[{"size":"44","stock":1}]},{"id":"cv2949_jodhpuri (3pcs)_wine","hsn":"620339","itemNo":"CV2949","type":"JODHPURI (3PCS)","colour":"WINE","code":"6562345140","photo":"","sizes":[{"size":"44","stock":1}]},{"id":"cv2955_jodhpuri (2pcs)_bk","hsn":"620339","itemNo":"CV2955","type":"JODHPURI (2PCS)","colour":"BK","code":"4041690623","photo":"","sizes":[{"size":"36","stock":1}]}];
    const WHATSAPP_NUMBER = "918660057253";
    let cartState = {};

    function cleanId(rawId) { return String(rawId).replace(/[^a-zA-Z0-9]/g, ''); }

    function renderProducts(items) {
        let grid = document.getElementById('catalogGrid');
        grid.innerHTML = '';
        items.forEach(p => {
            let sizeBoxes = '';
            let safeProdId = cleanId(p.id);
            p.sizes.forEach(s => {
                let safeSize = cleanId(s.size);
                let cartKey = safeProdId + '_' + safeSize;
                let curQty = cartState[cartKey] ? cartState[cartKey].qty : 0;
                sizeBoxes += `
                    <div class="size-box">
                        <span>Size <b>${s.size}</b></span>
                        <div class="stepper">
                            <button type="button" onclick="stepQty('${p.id}', '${s.size}', -1)">-</button>
                            <input type="number" class="qty-${safeProdId}-${safeSize}" value="${curQty}" readonly>
                            <button type="button" onclick="stepQty('${p.id}', '${s.size}', 1)">+</button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML += `
                <div class="card">
                    <div class="img-container"><img src="${p.photo || ''}" alt="${p.itemNo}"></div>
                    <div class="card-body">
                        <div class="item-title">${p.itemNo} - ${p.type}</div>
                        <div style="font-size:12px; color:#64748b;">Colour: ${p.colour}</div>
                        <div style="font-size:12px; font-weight:bold; color:#0369a1;">Code: ${p.code || 'N/A'}</div>
                        <div class="sizes-grid" style="margin-top:8px;">${sizeBoxes}</div>
                    </div>
                </div>
            `;
        });
    }

    function stepQty(prodId, size, delta) {
        let safeProdId = cleanId(prodId);
        let safeSize = cleanId(size);
        let cartKey = safeProdId + '_' + safeSize;
        let curQty = cartState[cartKey] ? cartState[cartKey].qty : 0;
        let newQty = Math.max(0, curQty + delta);

        if (newQty > 0) {
            let prod = products.find(p => p.id === prodId);
            cartState[cartKey] = { hsn: prod.hsn || '', itemNo: prod.itemNo, type: prod.type, colour: prod.colour, code: prod.code || 'N/A', size: size, qty: newQty };
        } else {
            delete cartState[cartKey];
        }

        document.querySelectorAll('.qty-' + safeProdId + '-' + safeSize).forEach(inp => inp.value = newQty);
        let total = Object.values(cartState).reduce((sum, i) => sum + i.qty, 0);
        document.getElementById('cartCount').innerText = total + " pcs";
    }

    function filterCatalog() {
        let q = document.getElementById('searchInput').value.toLowerCase();
        renderProducts(products.filter(p => `${p.itemNo} ${p.type} ${p.colour} ${p.code}`.toLowerCase().includes(q)));
    }

    function getAggregatedBillingMatrix() {
        let itemsList = Object.values(cartState);
        let groupMap = {};
        let sizesSet = new Set();

        itemsList.forEach(item => {
            let groupKey = `${item.hsn}_${item.itemNo.toLowerCase()}_${item.type.toLowerCase()}_${item.colour.toLowerCase()}_${item.code}`;
            if (!groupMap[groupKey]) {
                groupMap[groupKey] = {
                    hsn: item.hsn || '-',
                    itemNo: item.itemNo,
                    type: item.type,
                    colour: item.colour,
                    code: item.code,
                    sizesMap: {},
                    totalQty: 0
                };
            }
            sizesSet.add(item.size);
            groupMap[groupKey].sizesMap[item.size] = (groupMap[groupKey].sizesMap[item.size] || 0) + item.qty;
            groupMap[groupKey].totalQty += item.qty;
        });

        let sizesList = Array.from(sizesSet).sort((a, b) => {
            let na = parseFloat(a), nb = parseFloat(b);
            if (!isNaN(na) && !isNaN(nb)) return na - nb;
            return a.localeCompare(b);
        });

        return { groups: Object.values(groupMap), sizes: sizesList };
    }

    function openOrderModal() {
        if (Object.keys(cartState).length === 0) { alert("Cart is empty."); return; }
        let matrix = getAggregatedBillingMatrix();
        let groups = matrix.groups;
        let sizes = matrix.sizes;

        let html = '<table class="billing-matrix-table"><thead><tr><th style="width:35px;">SL</th><th style="width:65px;">HSN</th><th style="text-align:left;">Item Description</th><th style="width:85px;">Colour</th>';
        sizes.forEach(s => { html += `<th style="width:35px;">${s}</th>`; });
        html += '<th style="width:65px;">Tot Qty</th></tr></thead><tbody>';

        let grandQty = 0;
        groups.forEach((g, idx) => {
            grandQty += g.totalQty;
            html += `<tr>
                <td>${idx + 1}</td>
                <td>${g.hsn}</td>
                <td class="desc-col"><b>${g.itemNo}</b> ${g.type}</td>
                <td>${g.colour}</td>`;
            
            sizes.forEach(s => {
                let q = g.sizesMap[s] || '';
                html += `<td><b>${q}</b></td>`;
            });

            html += `<td><b>${g.totalQty}</b></td></tr>`;
        });

        html += `<tr style="background:#f1f5f9; font-weight:bold;"><td colspan="${4 + sizes.length}" style="text-align:right;">Grand Total Quantity:</td><td style="color:#0369a1;">${grandQty} pcs</td></tr></tbody></table>`;

        document.getElementById('orderTableContainer').innerHTML = html;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

    function generateOrderImage() {
        let buyer = document.getElementById('buyerName').value.trim() || 'Valued Customer';
        let addr = document.getElementById('buyerAddr').value.trim() || 'N/A';
        let phone = document.getElementById('buyerPhone').value.trim() || 'N/A';
        
        let matrix = getAggregatedBillingMatrix();
        let groups = matrix.groups;
        let sizes = matrix.sizes;

        let canvas = document.createElement('canvas');
        let ctx = canvas.getContext('2d');
        
        canvas.width = Math.max(800, 420 + (sizes.length * 45));
        canvas.height = 360 + (groups.length * 40);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#2d4059';
        ctx.fillRect(0, 0, canvas.width, 70);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Arial';
        ctx.fillText('VISHAL - ESTIMATE ORDER SLIP', 20, 45);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 15px Arial';
        ctx.fillText('Party Name: ' + buyer, 20, 110);
        ctx.font = '14px Arial';
        ctx.fillText('Address: ' + addr, 20, 135);
        ctx.fillText('Phone: ' + phone, 20, 160);

        let startY = 200;
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(20, startY, canvas.width - 40, 30);
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 12px Arial';
        ctx.fillText('SL', 30, startY + 20);
        ctx.fillText('HSN', 65, startY + 20);
        ctx.fillText('ITEM DESCRIPTION', 130, startY + 20);
        ctx.fillText('COLOUR', 320, startY + 20);

        let curX = 410;
        sizes.forEach(s => {
            ctx.fillText(String(s), curX, startY + 20);
            curX += 45;
        });

        ctx.fillText('TOT QTY', curX, startY + 20);

        let grandQty = 0;
        groups.forEach((g, idx) => {
            let y = startY + 55 + (idx * 35);
            grandQty += g.totalQty;
            ctx.font = '12px Arial';
            ctx.fillText(String(idx + 1), 30, y);
            ctx.fillText(g.hsn, 65, y);
            ctx.fillText(`${g.itemNo} ${g.type}`, 130, y);
            ctx.fillText(g.colour, 320, y);

            let sizeX = 410;
            sizes.forEach(s => {
                let q = g.sizesMap[s] || '';
                if (q) ctx.fillText(String(q), sizeX, y);
                sizeX += 45;
            });

            ctx.font = 'bold 12px Arial';
            ctx.fillText(String(g.totalQty), sizeX, y);
        });

        let footerY = startY + 55 + (groups.length * 35) + 20;
        ctx.fillStyle = '#2d4059';
        ctx.fillRect(20, footerY, canvas.width - 40, 40);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px Arial';
        ctx.fillText('GRAND TOTAL QUANTITY: ' + grandQty + ' pcs', 30, footerY + 26);

        let link = document.createElement('a');
        link.download = `Estimate_Order_${buyer.replace(/\s+/g, '_')}_${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
    }

    function sendWhatsAppOrder() {
        let buyer = document.getElementById('buyerName').value.trim();
        if (!buyer) { alert("Enter party name."); return; }
        
        let matrix = getAggregatedBillingMatrix();
        let groups = matrix.groups;
        let sizes = matrix.sizes;

        let msg = `*DIGITAL CATALOG ESTIMATE-STYLE ORDER FORM*

`;
        msg += `*Party Name:* ${buyer}
`;
        let addr = document.getElementById('buyerAddr').value.trim();
        if(addr) msg += `*Address:* ${addr}
`;
        msg += `-----------------------------------
`;
        msg += `*ITEM-WISE MATRIX ORDER BREAKDOWN:*

`;

        let grandQty = 0;
        groups.forEach((g, idx) => {
            grandQty += g.totalQty;
            let sizeBreakdownStr = sizes.map(s => `Size ${s}: ${g.sizesMap[s] || 0} pcs`).filter(str => !str.endsWith(': 0 pcs')).join(' | ');

            msg += `*${idx + 1}. ${g.itemNo} ${g.type}*
`;
            if (g.hsn && g.hsn !== '-') msg += `   HSN: ${g.hsn}
`;
            msg += `   Colour: ${g.colour}
`;
            msg += `   Sizes: *${sizeBreakdownStr}*
`;
            msg += `   Line Total: *${g.totalQty} pcs*
`;
            msg += `   10-Digit Code: *${g.code}*

`;
        });

        msg += `-----------------------------------
`;
        msg += `*GRAND TOTAL QUANTITY:* *${grandQty} pcs*
`;

        window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(msg)}`, '_blank');
    }

    renderProducts(products);
</script>
